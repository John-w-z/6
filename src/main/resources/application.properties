spring.datasource.url=jdbc:mysql://localhost:3306/spring_login_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234567890
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ===============================
# JWT
# ===============================
# Clave secreta Base64 (mínimo 256 bits = 32 bytes para HS256)
# Genera una con: openssl rand -base64 32
jwt.private-key=classpath:keys/private.pem
jwt.public-key=classpath:keys/public.pem
jwt.expiration=86400000
# 86400000 ms = 24 horas